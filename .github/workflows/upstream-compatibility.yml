name: Upstream compatibility
on:
  workflow_dispatch:
  schedule:
    - cron: '20 1 * * 1'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run ops:upstream -- --output=work/upstream-compatibility.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-compatibility
          path: work/upstream-compatibility.json
