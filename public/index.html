<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Go-Search · 选手历史查询</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="index.html" class="brand" aria-label="Go-Search 首页">
        <span class="brand-mark" aria-hidden="true">弈</span>
        <span class="brand-text">Go-Search<small>围棋赛事数据</small></span>
      </a>

      <nav class="app-nav" aria-label="主导航">
        <a href="index.html" class="active" aria-current="page"><span class="nav-index">01</span>选手查询</a>
        <a href="head-to-head.html"><span class="nav-index">02</span>交手记录</a>
        <a href="live-prediction.html"><span class="nav-index">03</span>赛中预测</a>
      </nav>

      <div class="sidebar-note">
        <span class="sidebar-dot" aria-hidden="true"></span>
        <span data-system-status>正在读取数据状态</span>
      </div>
    </aside>

    <main class="app-main">
      <header class="page-top">
        <div>
          <p class="eyebrow">PLAYER SEARCH</p>
          <h1>选手历史查询</h1>
          <p class="subtitle">全国赛事数据索引</p>
        </div>
        <div class="page-chip">近两年</div>
      </header>

      <form id="searchForm" class="search-card" autocomplete="on">
        <div class="section-heading">
          <h2>查询选手</h2>
        </div>

        <div class="form-row search-query-row">
          <div class="form-group flex-2">
            <label for="name">选手姓名 <span class="required">*</span></label>
            <input id="name" name="playerName" type="text" placeholder="请输入精确姓名" required autocomplete="name">
          </div>
          <div class="form-group flex-2">
            <label for="province">查询范围 <span class="required">*</span></label>
            <select id="province" required>
              <option value="" disabled selected>请选择省份</option>
              <option value="__ALL__">全国（所有省份）</option>
              <option value="浙江省">浙江省</option>
              <option value="广东省">广东省</option>
              <option value="江苏省">江苏省</option>
              <option value="安徽省">安徽省</option>
              <option value="四川省">四川省</option>
              <option value="广西">广西</option>
              <option value="湖南省">湖南省</option>
              <option value="福建省">福建省</option>
              <option value="北京市">北京市</option>
              <option value="重庆市">重庆市</option>
              <option value="河北省">河北省</option>
              <option value="山东省">山东省</option>
              <option value="江西省">江西省</option>
              <option value="陕西省">陕西省</option>
              <option value="山西省">山西省</option>
              <option value="海南省">海南省</option>
              <option value="甘肃省">甘肃省</option>
              <option value="新疆">新疆</option>
              <option value="上海市">上海市</option>
              <option value="湖北省">湖北省</option>
              <option value="黑龙江省">黑龙江省</option>
              <option value="云南省">云南省</option>
              <option value="辽宁省">辽宁省</option>
              <option value="河南省">河南省</option>
              <option value="贵州省">贵州省</option>
              <option value="内蒙古">内蒙古</option>
              <option value="吉林省">吉林省</option>
              <option value="宁夏">宁夏</option>
              <option value="天津市">天津市</option>
            </select>
          </div>
          <div class="form-actions search-actions">
            <button type="submit" id="searchBtn" class="btn-primary">查询</button>
            <button type="button" id="stopBtn" class="btn-stop" style="display:none">停止</button>
          </div>
        </div>
      </form>

      <section id="progressSection" style="display:none" class="progress-section" aria-live="polite">
        <div class="progress-header">
          <span id="progressText">准备中...</span>
          <span id="progressCount"></span>
        </div>
        <div class="progress-bar-wrap" role="progressbar" aria-label="查询进度">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </section>

      <section id="resultsSection" style="display:none" class="results-section">
        <div class="results-header">
          <h2 id="resultsTitle">查询结果</h2>
          <span id="resultCount" class="badge">0</span>
        </div>
        <div id="resultsList"></div>
      </section>
    </main>
  </div>

  <script src="common.js"></script>
  <script src="app.js"></script>
</body>
</html>
