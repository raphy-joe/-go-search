<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Go-Search · 赛中名次预测</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="index.html" class="brand" aria-label="Go-Search 首页">
        <span class="brand-mark" aria-hidden="true">弈</span>
        <span class="brand-text">Go-Search<small>围棋赛事数据</small></span>
      </a>

      <nav class="app-nav" aria-label="主导航">
        <a href="index.html"><span class="nav-index">01</span>选手查询</a>
        <a href="head-to-head.html"><span class="nav-index">02</span>交手记录</a>
        <a href="live-prediction.html" class="active" aria-current="page"><span class="nav-index">03</span>赛中预测</a>
      </nav>

      <div class="sidebar-note">
        <span class="sidebar-dot" aria-hidden="true"></span>
        <span data-system-status>正在读取数据状态</span>
      </div>
    </aside>

    <main class="app-main live-container">
      <header class="page-top">
        <div>
          <p class="eyebrow">LIVE PREDICTION</p>
          <h1>赛中名次预测</h1>
          <p class="subtitle">云比赛实时对阵与排名规则</p>
        </div>
        <div class="page-chip page-chip-live"><span aria-hidden="true"></span>实时</div>
      </header>

      <section class="search-card live-toolbar">
        <div class="section-heading">
          <h2>正在进行的比赛</h2>
        </div>
        <div class="form-row live-filter-row">
          <div class="form-group live-province-group">
            <label for="liveProvince">省份</label>
            <select id="liveProvince" required>
              <option value="" disabled selected>请选择省份</option>
              <option value="四川省">四川省</option>
              <option value="__ALL__">全国（所有省份）</option>
              <option value="浙江省">浙江省</option>
              <option value="广东省">广东省</option>
              <option value="江苏省">江苏省</option>
              <option value="安徽省">安徽省</option>
              <option value="广西">广西</option>
              <option value="湖南省">湖南省</option>
              <option value="福建省">福建省</option>
              <option value="北京市">北京市</option>
              <option value="重庆市">重庆市</option>
              <option value="河北省">河北省</option>
              <option value="山东省">山东省</option>
              <option value="江西省">江西省</option>
              <option value="陕西省">陕西省</option>
              <option value="山西省">山西省</option>
              <option value="海南省">海南省</option>
              <option value="甘肃省">甘肃省</option>
              <option value="新疆">新疆</option>
              <option value="上海市">上海市</option>
              <option value="湖北省">湖北省</option>
              <option value="黑龙江省">黑龙江省</option>
              <option value="云南省">云南省</option>
              <option value="辽宁省">辽宁省</option>
              <option value="河南省">河南省</option>
              <option value="贵州省">贵州省</option>
              <option value="内蒙古">内蒙古</option>
              <option value="吉林省">吉林省</option>
              <option value="宁夏">宁夏</option>
              <option value="天津市">天津市</option>
            </select>
          </div>
          <div class="form-actions search-actions">
            <button type="button" id="loadLiveEventsBtn" class="btn-primary">确定</button>
          </div>
        </div>
      </section>

      <section id="liveEventsSection" class="live-section" style="display:none">
        <div class="results-header">
          <h2>比赛列表</h2>
          <span id="liveEventCount" class="badge">0</span>
        </div>
        <div id="liveEventsList" class="live-event-list"></div>
      </section>

      <section id="liveGroupSection" class="live-section" style="display:none">
        <div class="search-card live-group-card">
          <div class="h2h-heading">
            <div>
              <div id="selectedEventTitle" class="h2h-title"></div>
              <div id="selectedEventMeta" class="live-muted"></div>
            </div>
            <div class="live-heading-actions">
              <a id="backToLiveList" href="live-prediction.html" class="text-action" style="display:none">返回赛事列表</a>
              <a id="selectedEventLink" href="#" target="_blank" rel="noopener" class="text-action">云比赛页面</a>
            </div>
          </div>
          <div class="form-row live-group-row">
            <div class="form-group live-group-select-wrap">
              <label for="liveGroupSelect">比赛组别</label>
              <select id="liveGroupSelect"></select>
            </div>
            <div class="form-actions search-actions">
              <button type="button" id="refreshLiveGroupBtn" class="btn-secondary">刷新</button>
            </div>
          </div>
        </div>

        <div id="livePlayersPanel" class="live-panel"></div>
      </section>

      <section id="livePredictionSection" class="live-section" style="display:none">
        <div id="livePredictionPanel" class="live-panel"></div>
      </section>
    </main>
  </div>

  <script src="common.js"></script>
  <script src="live-prediction.js"></script>
</body>
</html>
